[package]
name = "pinyinwl"
version = "0.1.0"
edition = "2021"
description = "Pinyin input method for Wayland using libchinese/libpinyin"

[[bin]]
name = "pinyinwl"
path = "src/main.rs"

[[bin]]
name = "cosmic-applet-pinyin"
path = "src/applet.rs"

[dependencies]
libcosmic = { git = "https://github.com/rano-oss/libcosmic", branch = "input-method-unstable-v3", features = ["wayland", "wayland_input_method", "winit", "applet"] }
cosmic-comp-config = { git = "https://github.com/rano-oss/cosmic-comp", branch = "input-method-unstable-v3" }
libpinyin = { path = "../libchinese/libpinyin" }
libchinese-core = { path = "../libchinese/core" }
env_logger = "0.10"
log = "0.4"
zbus = "5"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
libc = "0.2"
# Pin wayland-client: 0.31.15 breaks sctk 0.20 / iced_winit frame() API
wayland-client = "=0.31.14"
wayland-cursor = "=0.31.14"

[profile.release]
lto = true
strip = true
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
wayland-protocols = { git = "https://github.com/rano-oss/wayland-rs.git", branch = "input-method-unstable-v3" }
wayland-protocols-experimental = { git = "https://github.com/rano-oss/wayland-rs.git", branch = "input-method-unstable-v3" }

[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { git = "https://github.com/rano-oss/libcosmic", branch = "input-method-unstable-v3" }
cosmic-config = { git = "https://github.com/rano-oss/libcosmic", branch = "input-method-unstable-v3" }
