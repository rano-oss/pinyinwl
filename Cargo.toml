[package]
name = "pinyinwl"
version = "0.1.0"
edition = "2021"
description = "Pinyin input method for Wayland using libchinese/libpinyin"

[[bin]]
name = "pinyinwl"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/rano-oss/libcosmic", branch = "experimental/xx-im-preedit-start", features = ["wayland", "wayland_input_method", "winit", "wgpu"] }
libpinyin = { git = "https://github.com/rano-oss/libchinese", branch = "main", package = "libpinyin" }
libchinese-core = { git = "https://github.com/rano-oss/libchinese", branch = "main", package = "libchinese-core" }
ime-control = { path = "ime-control" }
env_logger = "0.10"
log = "0.4"
zbus = "5"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
libc = "0.2"
# Pin wayland-client: 0.31.15 breaks sctk 0.20 / iced_winit frame() API
wayland-client = "=0.31.14"
wayland-cursor = "=0.31.14"

[profile.release]
lto = true
strip = true
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2

[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { git = "https://github.com/rano-oss/libcosmic", branch = "experimental/xx-im-preedit-start" }
cosmic-config = { git = "https://github.com/rano-oss/libcosmic", branch = "experimental/xx-im-preedit-start" }

